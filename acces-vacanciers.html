<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06405C">
<title>Sud Wifi — Espace client · Accès vacanciers</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icone-192.png">
<link rel="apple-touch-icon" href="assets/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sud Wifi démo">
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#FBF8F1;font-family:'Quicksand',system-ui,sans-serif;font-weight:500;color:#0E2A38}
a{color:#007EB1}a:hover{color:#005F86}
html,body{margin:0;height:100%;overflow:hidden;background:#06405C}
#dc-root{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.demo-btn{position:fixed;right:14px;bottom:14px;z-index:50;width:40px;height:40px;border-radius:50%;border:none;background:rgba(6,64,92,.35);color:#fff;font-size:18px;cursor:pointer;opacity:.45;transition:opacity .2s}
.demo-btn:hover,.demo-btn:focus-visible{opacity:1;background:#06405C}
.demo-panel{position:fixed;right:14px;bottom:62px;z-index:50;width:260px;background:#fff;color:#0E2A38;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px;font-family:'Quicksand',system-ui,sans-serif;font-weight:500;display:flex;flex-direction:column;gap:4px}
.demo-panel[hidden]{display:none}
.demo-title{margin:0 0 6px;font-family:'Fira Sans',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;color:#06405C}
.demo-panel a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:#0E2A38;text-decoration:none;font-size:14px}
.demo-panel a span{width:22px;height:22px;border-radius:50%;background:#E2F4FA;color:#005A80;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.demo-panel a:hover{background:#F2F9FC}
.demo-panel a[aria-current]{background:#007EB1;color:#fff;font-weight:700}
.demo-panel a[aria-current] span{background:#fff}
.demo-fs{margin-top:6px;font-family:inherit;font-size:14px;font-weight:700;padding:10px;border:none;border-radius:9px;background:#FAC420;color:#06405C;cursor:pointer}
.demo-hint{margin:6px 0 0;font-size:11px;color:#4A5A66;line-height:1.4}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 1440px; height: 1000px; display: flex; background: #FBF8F1; font-family: 'Quicksand', system-ui, sans-serif; color: #0E2A38">

<nav aria-label="Navigation principale" style="width: 256px; flex-shrink: 0; background: #06405C; color: #FFFFFF; display: flex; flex-direction: column; padding: 28px 18px; box-sizing: border-box; gap: 28px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 8px">
<img src="assets/logo-sud-wifi-nav.png" alt="Sud Wifi" style="width: 124px; height: auto; display: block">
<span style="font-size: 12px; color: #BFE3F0; letter-spacing: 0.12em; text-transform: uppercase">Espace client</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="tableau-de-bord.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Tableau de bord</a>
<a href="supervision.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Supervision temps réel</a>
<a href="suivi-sud-wifi.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Suivi Sud Wifi</a>
<a href="acces-vacanciers.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; background: #007EB1; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Accès vacanciers</a>
<a href="https://client.canalplus.com/?sc_intcmp=BUSINESS:USERMENU:CLIENT" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Canal+ Business<span aria-hidden="true">↗</span></a>
<a href="https://axonaut.com/customerPortal/userZone/dashboard" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Factures, contrats et tickets<span aria-hidden="true">↗</span></a>
<a href="mon-equipe.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Mon équipe</a>
<a href="https://aide.wifi-camping-var.fr" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Aide aux vacanciers<span aria-hidden="true">↗</span></a>
<div style="height: 1px; background: #0A5277; margin: 6px 4px"></div>
<a href="#" aria-disabled="true" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #9FC3D6; text-decoration: none; font-size: 15px">Vidéosurveillance<span style="font-size: 11px; background: #0A5277; color: #E3F2F8; padding: 3px 7px; border-radius: 6px">bientôt</span></a>
</div>
<div style="margin-top: auto; background: #0A5277; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; color: #BFE3F0; text-transform: uppercase; letter-spacing: 0.06em">Votre interlocuteur</span>
<span style="font-weight: 600; font-size: 15px">Anthony, votre technicien</span>
<a href="tel:+33494030811" style="font-size: 16px; font-weight: 700; color: #FFFFFF; text-decoration: none">04 94 03 08 11</a>
<a href="mailto:support@sudwifi.fr" style="margin-top: 4px; text-align: center; background: #FAC420; color: #06405C; text-decoration: none; font-weight: 700; padding: 11px; border-radius: 10px; font-size: 14px">Contacter Sud Wifi</a>
<span style="font-size: 12px; color: #BFE3F0; text-align: center">support@sudwifi.fr</span>
</div>
</nav>

<main style="flex-grow: 1; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
<header style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: #4A5A66">Camping de démonstration</span>
<h1 style="margin: 0; font-family: 'Fira Sans', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.02em">Accès vacanciers</h1>
</div>
<a href="https://aide.wifi-camping-var.fr" target="_blank" rel="noopener" style="font-size: 14px; font-weight: 600">Site d'aide pour vos vacanciers ↗</a>
</header>

<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; flex-grow: 1">
<section aria-label="Générer un code" style="grid-column: span 2; background: #FFFFFF; border-radius: 16px; padding: 24px; border: 1px solid #E3DDD1; display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 700">Générer un code d'accès</h2>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Durée</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{durations}}" as="d" hint-placeholder-count="4">
<button type="button" onClick="{{d.pick}}" style="font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; min-height: 44px; border-radius: 999px; cursor: pointer; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}">{{d.label}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="dev" style="font-size: 14px; font-weight: 600">Appareils</label>
<select id="dev" style="font-family: inherit; font-size: 15px; padding: 11px 12px; border-radius: 10px; border: 1px solid #D6CFC1; background: #FFFFFF; min-height: 44px"><option>1 appareil</option><option selected="">3 appareils</option><option>5 appareils</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="loc" style="font-size: 14px; font-weight: 600">Hébergement (option)</label>
<input id="loc" type="text" placeholder="ex. MH 214" style="font-family: inherit; font-size: 15px; padding: 11px 12px; border-radius: 10px; border: 1px solid #D6CFC1; min-height: 44px; box-sizing: border-box">
</div>
</div>
<button type="button" onClick="{{generate}}" style="font-family: inherit; font-size: 16px; font-weight: 700; padding: 15px; min-height: 48px; border-radius: 12px; border: none; background: #007EB1; color: #FFFFFF; cursor: pointer">Générer le code</button>
<sc-if value="{{hasCode}}" hint-placeholder-val="{{ true }}">
<div style="background: #E2F4FA; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px; align-items: center">
<span style="font-size: 13px; color: #005A80">Code prêt · {{durationLabel}}</span>
<span style="font-family: 'Fira Sans', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: 0.12em; color: #005A80">{{code}}</span>
<div style="display: flex; gap: 10px">
<button type="button" style="font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 14px; min-height: 44px; border-radius: 10px; border: 1px solid #8FD0E6; background: #FFFFFF; color: #005A80; cursor: pointer">Imprimer le ticket</button>
<button type="button" style="font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 14px; min-height: 44px; border-radius: 10px; border: 1px solid #8FD0E6; background: #FFFFFF; color: #005A80; cursor: pointer">Envoyer par SMS</button>
</div>
</div>
</sc-if>
</section>

<div style="grid-column: span 3; display: flex; flex-direction: column; gap: 16px">
<section aria-label="Ventes" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border-radius: 16px; padding: 18px 20px; border: 1px solid #E3DDD1; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; color: #4A5A66">Paiements en ligne (7 j)</span>
<span style="font-family: 'Fira Sans', sans-serif; font-size: 28px; font-weight: 700">98</span>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 18px 20px; border: 1px solid #E3DDD1; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; color: #4A5A66">Codes accueil (7 j)</span>
<span style="font-family: 'Fira Sans', sans-serif; font-size: 28px; font-weight: 700">29</span>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 18px 20px; border: 1px solid #E3DDD1; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; color: #4A5A66">Codes envoyés avec succès</span>
<span style="font-family: 'Fira Sans', sans-serif; font-size: 28px; font-weight: 700; color: #005A80">100 %</span>
</div>
</section>
<section aria-label="Derniers accès" style="background: #FFFFFF; border-radius: 16px; border: 1px solid #E3DDD1; overflow: hidden; flex-grow: 1">
<div style="padding: 18px 22px; border-bottom: 1px solid #E3DDD1">
<h2 style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700">Derniers accès délivrés</h2>
</div>
<div style="display: grid; grid-template-columns: 1.2fr 1.3fr 1fr 1.2fr 1fr; padding: 12px 22px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #4A5A66; background: #FAF8F3">
<span>Code</span><span>Formule</span><span>Canal</span><span>Hébergement</span><span>Expire</span>
</div>
<sc-for list="{{recent}}" as="r" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: 1.2fr 1.3fr 1fr 1.2fr 1fr; padding: 13px 22px; font-size: 15px; border-top: 1px solid #EFEAE0">
<span style="font-weight: 700; letter-spacing: 0.06em">{{r.code}}</span>
<span>{{r.plan}}</span>
<span style="color: #4A5A66">{{r.channel}}</span>
<span style="color: #4A5A66">{{r.loc}}</span>
<span style="color: #4A5A66">{{r.exp}}</span>
</div>
</sc-for>
</section>
</div>
</div>
</main>
</div>
</template>
<script src="assets/dc-lite.js"></script>
<script>
window.DEMO_PAGES = [{"file": "index.html", "title": "Connexion"}, {"file": "tableau-de-bord.html", "title": "Tableau de bord"}, {"file": "supervision.html", "title": "Supervision temps réel"}, {"file": "suivi-sud-wifi.html", "title": "Suivi Sud Wifi"}, {"file": "acces-vacanciers.html", "title": "Accès vacanciers"}, {"file": "mon-equipe.html", "title": "Mon équipe"}, {"file": "mobile.html", "title": "Version mobile"}];
window.DEMO_PAGE = {"file": "acces-vacanciers.html", "w": 1440, "h": 1000, "props": {}};
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { dur: 's7', code: null }; }
  renderVals() {
    const opts = [['j1', '24 h'], ['j3', '3 jours'], ['s7', '7 jours'], ['sej', 'Tout le séjour']];
    const durations = opts.map(([id, label]) => {
      const on = this.state.dur === id;
      return { label, pick: () => this.setState({ dur: id }), bg: on ? '#007EB1' : '#FFFFFF', fg: on ? '#FFFFFF' : '#005A80', border: on ? '#007EB1' : '#B7E0EE' };
    });
    const durationLabel = (opts.find((o) => o[0] === this.state.dur) || opts[2])[1];
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const generate = () => {
      let c = '';
      for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
      this.setState({ code: c.slice(0, 3) + '-' + c.slice(3) });
    };
    const recent = [
      { code: 'K7P-X2M', plan: '7 jours · 3 app.', channel: 'Paiement en ligne', loc: 'MH 214', exp: 'dans 6 j' },
      { code: 'R4T-9QZ', plan: 'Séjour · 5 app.', channel: 'Accueil', loc: 'Emplacement 88', exp: 'dans 11 j' },
      { code: 'H2N-W8C', plan: '24 h · 1 app.', channel: 'Paiement en ligne', loc: '—', exp: 'dans 19 h' },
      { code: 'M9D-3LV', plan: '3 jours · 3 app.', channel: 'Paiement en ligne', loc: 'MH 102', exp: 'dans 2 j' },
      { code: 'B6Y-T4R', plan: '7 jours · 3 app.', channel: 'Accueil', loc: 'MH 047', exp: 'dans 5 j' },
      { code: 'Z3F-8KP', plan: 'Séjour · 3 app.', channel: 'Paiement en ligne', loc: 'Emplacement 12', exp: 'dans 9 j' },
      { code: 'Q8W-2HN', plan: '24 h · 1 app.', channel: 'Accueil', loc: '—', exp: 'dans 7 h' }
    ];
    return { durations, durationLabel, generate, hasCode: !!this.state.code, code: this.state.code || 'K7P-X2M', recent };
  }
}
window.Component = Component;
</script>
</body>
</html>
