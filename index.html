<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06405C">
<title>Sud Wifi — Espace client · Connexion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icone-192.png">
<link rel="apple-touch-icon" href="assets/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sud Wifi démo">
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#FBF8F1;font-family:'Quicksand',system-ui,sans-serif;font-weight:500;color:#0E2A38}
a{color:#007EB1}a:hover{color:#005F86}
html,body{margin:0;height:100%;overflow:hidden;background:#06405C}
#dc-root{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.demo-btn{position:fixed;right:14px;bottom:14px;z-index:50;width:40px;height:40px;border-radius:50%;border:none;background:rgba(6,64,92,.35);color:#fff;font-size:18px;cursor:pointer;opacity:.45;transition:opacity .2s}
.demo-btn:hover,.demo-btn:focus-visible{opacity:1;background:#06405C}
.demo-panel{position:fixed;right:14px;bottom:62px;z-index:50;width:260px;background:#fff;color:#0E2A38;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px;font-family:'Quicksand',system-ui,sans-serif;font-weight:500;display:flex;flex-direction:column;gap:4px}
.demo-panel[hidden]{display:none}
.demo-title{margin:0 0 6px;font-family:'Fira Sans',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;color:#06405C}
.demo-panel a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:#0E2A38;text-decoration:none;font-size:14px}
.demo-panel a span{width:22px;height:22px;border-radius:50%;background:#E2F4FA;color:#005A80;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.demo-panel a:hover{background:#F2F9FC}
.demo-panel a[aria-current]{background:#007EB1;color:#fff;font-weight:700}
.demo-panel a[aria-current] span{background:#fff}
.demo-fs{margin-top:6px;font-family:inherit;font-size:14px;font-weight:700;padding:10px;border:none;border-radius:9px;background:#FAC420;color:#06405C;cursor:pointer}
.demo-hint{margin:6px 0 0;font-size:11px;color:#4A5A66;line-height:1.4}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 1440px; height: 1000px; display: flex; background: #FBF8F1; font-family: 'Quicksand', system-ui, sans-serif; color: #0E2A38">

<section aria-label="Sud Wifi" style="width: 620px; flex-shrink: 0; background: #06405C; color: #FFFFFF; padding: 56px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
<img src="assets/logo-sud-wifi-nav.png" alt="Sud Wifi" style="width: 190px; height: auto; display: block">
<span style="font-size: 13px; color: #BFE3F0; letter-spacing: 0.12em; text-transform: uppercase">Espace client</span>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-family: 'Fira Sans', sans-serif; font-size: 44px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em">Votre Wifi,<br>suivi par Sud Wifi.</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.5; color: #E3F2F8; max-width: 440px">Statut de votre réseau, codes d'accès vacanciers, interventions et rapports : tout au même endroit.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 24px; border-top: 1px solid #0A5277">
<span style="font-size: 14px; color: #BFE3F0">Besoin d'aide pour vous connecter ?</span>
<span style="font-size: 16px; font-weight: 600">04 94 03 08 11 · support@sudwifi.fr</span>
</div>
</section>

<main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box">
<div style="width: 460px; background: #FFFFFF; border: 1px solid #E3DDD1; border-radius: 20px; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

<sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<img src="assets/logo-sud-wifi-couleur.png" alt="" aria-hidden="true" style="width: 96px; height: auto; display: block; margin-bottom: 10px">
<h2 style="margin: 0; font-family: 'Fira Sans', sans-serif; font-size: 30px; font-weight: 700">Connexion</h2>
<span style="font-size: 15px; color: #4A5A66">Utilisez l'adresse e-mail de votre invitation.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 600">Adresse e-mail</label>
<input id="email" type="email" value="gerant@camping-exemple.fr" style="font-family: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 1px solid #D6CFC1; min-height: 48px; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="pwd" style="font-size: 14px; font-weight: 600">Mot de passe</label>
<a href="#" style="font-size: 14px; font-weight: 600">Mot de passe oublié ?</a>
</div>
<input id="pwd" type="password" value="motdepasse" style="font-family: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 1px solid #D6CFC1; min-height: 48px; box-sizing: border-box">
</div>
<button type="button" onClick="{{next}}" style="font-family: inherit; font-size: 16px; font-weight: 700; padding: 15px; min-height: 50px; border-radius: 12px; border: none; background: #007EB1; color: #FFFFFF; cursor: pointer">Se connecter</button>
<span style="font-size: 13px; color: #4A5A66; line-height: 1.5">Sud Wifi ne vous demandera jamais votre mot de passe, ni par téléphone ni par e-mail.</span>
</div>
</sc-if>

<sc-if value="{{isMfa}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Fira Sans', sans-serif; font-size: 30px; font-weight: 700">Vérification</h2>
<span style="font-size: 15px; color: #4A5A66; line-height: 1.5">Saisissez le code à 6 chiffres envoyé par SMS au 06 •• •• •• 42.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="otp" style="font-size: 14px; font-weight: 600">Code de vérification</label>
<input id="otp" type="text" inputmode="numeric" value="482 913" style="font-family: 'Fira Sans', sans-serif; font-size: 28px; letter-spacing: 0.3em; text-align: center; padding: 12px 14px; border-radius: 10px; border: 1px solid #D6CFC1; min-height: 60px; box-sizing: border-box">
</div>
<a href="tableau-de-bord.html" style="text-align: center; font-size: 16px; font-weight: 700; padding: 15px; border-radius: 12px; background: #007EB1; color: #FFFFFF; text-decoration: none">Valider</a>
<div style="display: flex; justify-content: space-between">
<button type="button" onClick="{{back}}" style="font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 0; min-height: 44px; border: none; background: none; color: #007EB1; cursor: pointer">← Retour</button>
<a href="#" style="font-size: 14px; font-weight: 600; align-self: center">Renvoyer le code</a>
</div>
<span style="font-size: 13px; color: #4A5A66; line-height: 1.5">Étape demandée pour les comptes Gérant. Les comptes Accueil se connectent en une seule étape.</span>
</div>
</sc-if>

</div>
</main>
</div>
</template>
<script src="assets/dc-lite.js"></script>
<script>
window.DEMO_PAGES = [{"file": "index.html", "title": "Connexion"}, {"file": "tableau-de-bord.html", "title": "Tableau de bord"}, {"file": "supervision.html", "title": "Supervision temps réel"}, {"file": "suivi-sud-wifi.html", "title": "Suivi Sud Wifi"}, {"file": "acces-vacanciers.html", "title": "Accès vacanciers"}, {"file": "mon-equipe.html", "title": "Mon équipe"}, {"file": "mobile.html", "title": "Version mobile"}];
window.DEMO_PAGE = {"file": "index.html", "w": 1440, "h": 1000, "props": {}};
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 'login' }; }
  renderVals() {
    return {
      isLogin: this.state.step === 'login',
      isMfa: this.state.step === 'mfa',
      next: () => this.setState({ step: 'mfa' }),
      back: () => this.setState({ step: 'login' })
    };
  }
}
window.Component = Component;
</script>
</body>
</html>
