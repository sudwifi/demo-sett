<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06405C">
<title>Sud Wifi — Espace client · Tableau de bord</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icone-192.png">
<link rel="apple-touch-icon" href="assets/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sud Wifi démo">
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#FBF8F1;font-family:'Quicksand',system-ui,sans-serif;font-weight:500;color:#0E2A38}
a{color:#007EB1}a:hover{color:#005F86}
html,body{margin:0;height:100%;overflow:hidden;background:#06405C}
#dc-root{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.demo-btn{position:fixed;right:14px;bottom:14px;z-index:50;width:40px;height:40px;border-radius:50%;border:none;background:rgba(6,64,92,.35);color:#fff;font-size:18px;cursor:pointer;opacity:.45;transition:opacity .2s}
.demo-btn:hover,.demo-btn:focus-visible{opacity:1;background:#06405C}
.demo-panel{position:fixed;right:14px;bottom:62px;z-index:50;width:260px;background:#fff;color:#0E2A38;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px;font-family:'Quicksand',system-ui,sans-serif;font-weight:500;display:flex;flex-direction:column;gap:4px}
.demo-panel[hidden]{display:none}
.demo-title{margin:0 0 6px;font-family:'Fira Sans',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;color:#06405C}
.demo-panel a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:#0E2A38;text-decoration:none;font-size:14px}
.demo-panel a span{width:22px;height:22px;border-radius:50%;background:#E2F4FA;color:#005A80;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.demo-panel a:hover{background:#F2F9FC}
.demo-panel a[aria-current]{background:#007EB1;color:#fff;font-weight:700}
.demo-panel a[aria-current] span{background:#fff}
.demo-fs{margin-top:6px;font-family:inherit;font-size:14px;font-weight:700;padding:10px;border:none;border-radius:9px;background:#FAC420;color:#06405C;cursor:pointer}
.demo-hint{margin:6px 0 0;font-size:11px;color:#4A5A66;line-height:1.4}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 1440px; height: 1000px; display: flex; background: #FBF8F1; font-family: 'Quicksand', system-ui, sans-serif; color: #0E2A38">

<nav aria-label="Navigation principale" style="width: 256px; flex-shrink: 0; background: #06405C; color: #FFFFFF; display: flex; flex-direction: column; padding: 28px 18px; box-sizing: border-box; gap: 28px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 8px">
<img src="assets/logo-sud-wifi-nav.png" alt="Sud Wifi" style="width: 124px; height: auto; display: block">
<span style="font-size: 12px; color: #BFE3F0; letter-spacing: 0.12em; text-transform: uppercase">Espace client</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="tableau-de-bord.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; background: #007EB1; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Tableau de bord</a>
<a href="supervision.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Supervision temps réel</a>
<a href="suivi-sud-wifi.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Suivi Sud Wifi</a>
<a href="acces-vacanciers.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Accès vacanciers</a>
<a href="https://client.canalplus.com/?sc_intcmp=BUSINESS:USERMENU:CLIENT" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Canal+ Business<span aria-hidden="true">↗</span></a>
<a href="https://axonaut.com/customerPortal/userZone/dashboard" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Factures, contrats et tickets<span aria-hidden="true">↗</span></a>
<a href="mon-equipe.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Mon équipe</a>
<a href="https://aide.wifi-camping-var.fr" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Aide aux vacanciers<span aria-hidden="true">↗</span></a>
<div style="height: 1px; background: #0A5277; margin: 6px 4px"></div>
<a href="#" aria-disabled="true" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #9FC3D6; text-decoration: none; font-size: 15px">Vidéosurveillance<span style="font-size: 11px; background: #0A5277; color: #E3F2F8; padding: 3px 7px; border-radius: 6px">bientôt</span></a>
</div>
<div style="margin-top: auto; background: #0A5277; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; color: #BFE3F0; text-transform: uppercase; letter-spacing: 0.06em">Votre interlocuteur</span>
<span style="font-weight: 600; font-size: 15px">Anthony, votre technicien</span>
<a href="tel:+33494030811" style="font-size: 16px; font-weight: 700; color: #FFFFFF; text-decoration: none">04 94 03 08 11</a>
<a href="mailto:support@sudwifi.fr" style="margin-top: 4px; text-align: center; background: #FAC420; color: #06405C; text-decoration: none; font-weight: 700; padding: 11px; border-radius: 10px; font-size: 14px">Contacter Sud Wifi</a>
<span style="font-size: 12px; color: #BFE3F0; text-align: center">support@sudwifi.fr</span>
</div>
</nav>

<main style="flex-grow: 1; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: #4A5A66">Camping de démonstration · ★★★★★</span>
<h1 style="margin: 0; font-family: 'Fira Sans', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.02em">Bonjour Claire.</h1>
</div>
<div style="display: flex; gap: 12px; align-items: center">
<label for="site" style="font-size: 13px; color: #4A5A66">Établissement</label>
<select id="site" style="font-family: inherit; font-size: 14px; padding: 11px 14px; border-radius: 10px; border: 1px solid #D6CFC1; background: #FFFFFF; color: #0E2A38; min-height: 44px"><option>Camping de démonstration</option></select>
</div>
</header>

<section aria-label="État de votre Wifi" onClick="{{toggle}}" style="cursor: pointer; border-radius: 20px; padding: 26px 30px; display: flex; align-items: center; gap: 26px; background: {{hero.bg}}; border: 1px solid {{hero.border}}">
<div style="width: 84px; height: 84px; border-radius: 50%; background: {{hero.iconBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="58" height="48" viewBox="0 0 48 40" fill="none" stroke="{{hero.icon}}" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M24 3v10"></path><path d="M12 8l4.5 8"></path><path d="M36 8l-4.5 8"></path><path d="M3 18l8.5 5"></path><path d="M45 18l-8.5 5"></path><path d="M3 33h6"></path><path d="M39 33h6"></path><path d="M12 33a12 12 0 0 1 24 0"></path><path d="M16.5 33a7.5 7.5 0 0 1 15 0"></path><circle cx="24" cy="31.5" r="1.6" fill="{{hero.icon}}"></circle></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<span style="font-family: 'Fira Sans', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; color: #0E2A38">{{hero.title}}</span>
<span style="font-size: 16px; color: #33434E; max-width: 760px">{{hero.text}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0">
<span style="font-size: 13px; color: #4A5A66">Disponibilité ce mois-ci</span>
<span style="font-family: 'Fira Sans', sans-serif; font-size: 30px; font-weight: 700; color: #005A80">99,8 %</span>
</div>
</section>

<section aria-label="Indicateurs clés" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #E3DDD1">
<span style="font-size: 14px; color: #4A5A66">Vacanciers connectés</span>
<span style="font-family: 'Fira Sans', sans-serif; font-size: 30px; font-weight: 700">318</span>
<span style="font-size: 13px; color: #4A5A66">en ce moment</span>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #E3DDD1">
<span style="font-size: 14px; color: #4A5A66">Accès vendus (7 jours)</span>
<span style="font-family: 'Fira Sans', sans-serif; font-size: 30px; font-weight: 700">127</span>
<span style="font-size: 13px; color: #4A5A66">1 270 € de chiffre d'affaires</span>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #E3DDD1">
<span style="font-size: 14px; color: #4A5A66">Interventions Sud Wifi (ce mois)</span>
<span style="font-family: 'Fira Sans', sans-serif; font-size: 30px; font-weight: 700">3</span>
<span style="font-size: 13px; color: #005A80; font-weight: 600">{{interLabel}}</span>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; flex-grow: 1; min-height: 0">
<section aria-label="Messages de Sud Wifi" style="grid-column: span 2; background: #FFFFFF; border-radius: 16px; padding: 22px 24px; border: 1px solid #E3DDD1; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px">
<h2 style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700">Les messages de Sud Wifi</h2>
<a href="suivi-sud-wifi.html" style="font-size: 14px; font-weight: 600">Tout l'historique</a>
</div>
<sc-for list="{{feed}}" as="m" hint-placeholder-count="4">
<div style="display: flex; gap: 16px; padding: 13px 0; border-top: 1px solid #EFEAE0; align-items: flex-start">
<span style="width: 92px; flex-shrink: 0; font-size: 13px; color: #4A5A66; padding-top: 3px">{{m.when}}</span>
<span style="flex-shrink: 0; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{m.bg}}; color: {{m.fg}}">{{m.tag}}</span>
<span style="font-size: 15px; color: #0E2A38; line-height: 1.45">{{m.text}}</span>
</div>
</sc-for>
</section>

<section aria-label="Actions rapides" style="background: #FFFFFF; border-radius: 16px; padding: 22px; border: 1px solid #E3DDD1; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0 0 4px; font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700">Actions rapides</h2>
<a href="acces-vacanciers.html" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 600; padding: 14px 16px; border-radius: 12px; font-size: 15px">Générer un code d'accès</a>
<a href="#" style="background: #E2F4FA; color: #005A80; text-decoration: none; font-weight: 600; padding: 14px 16px; border-radius: 12px; font-size: 15px">Changer le mot de passe Wifi staff</a>
<a href="mailto:support@sudwifi.fr" style="background: #E2F4FA; color: #005A80; text-decoration: none; font-weight: 600; padding: 14px 16px; border-radius: 12px; font-size: 15px">Poser une question à Sud Wifi</a>
<a href="https://axonaut.com/customerPortal/userZone/dashboard" target="_blank" rel="noopener" style="background: #E2F4FA; color: #005A80; text-decoration: none; font-weight: 600; padding: 14px 16px; border-radius: 12px; font-size: 15px">Mes factures et contrats ↗</a>
<a href="#" style="margin-top: auto; display: flex; flex-direction: column; gap: 2px; background: #FEF3D6; border: 1px solid #FAC420; text-decoration: none; padding: 14px 16px; border-radius: 12px">
<span style="font-size: 12px; color: #6B4A1E; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600">Nouveau</span>
<span style="font-size: 15px; font-weight: 700; color: #0E2A38">Votre rapport de septembre</span>
<span style="font-size: 13px; color: #4A3A2E">Fréquentation, ventes et interventions du mois</span>
</a>
</section>
</div>
</main>
</div>
</template>
<script src="assets/dc-lite.js"></script>
<script>
window.DEMO_PAGES = [{"file": "index.html", "title": "Connexion"}, {"file": "tableau-de-bord.html", "title": "Tableau de bord"}, {"file": "supervision.html", "title": "Supervision temps réel"}, {"file": "suivi-sud-wifi.html", "title": "Suivi Sud Wifi"}, {"file": "acces-vacanciers.html", "title": "Accès vacanciers"}, {"file": "mon-equipe.html", "title": "Mon équipe"}, {"file": "mobile.html", "title": "Version mobile"}];
window.DEMO_PAGE = {"file": "tableau-de-bord.html", "w": 1440, "h": 1000, "props": {"etat": "ok", "accent": "#007EB1"}};
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { incident: null }; }
  renderVals() {
    const accent = this.props.accent ?? '#007EB1';
    const incident = this.state.incident ?? (this.props.etat === 'incident');
    const toggle = () => this.setState({ incident: !incident });
    const hero = incident
      ? { bg: '#FEF3D6', border: '#FAC420', iconBg: '#FFFFFF', icon: '#D6711A',
          title: 'Un souci sur la zone piscine. On s\'en occupe.',
          text: 'Détecté à 07:02 par Sud Wifi. Intervention à distance en cours, retour à la normale estimé avant 08:00. Rien à faire de votre côté.' }
      : { bg: '#FFFFFF', border: '#E3DDD1', iconBg: '#06405C', icon: '#FAC420',
          title: 'Votre Wifi va bien.',
          text: 'Sud Wifi surveille votre réseau en continu et vous prévient s\'il se passe quoi que ce soit. Dernière vérification il y a 2 min.' };
    const T = {
      cours: { tag: 'En cours', bg: '#FEF3D6', fg: '#8A4A0A' },
      ok: { tag: 'Résolu', bg: '#E2F4FA', fg: '#005A80' },
      maint: { tag: 'Maintenance', bg: '#EEF0F2', fg: '#3A4A55' },
      info: { tag: 'Info', bg: '#E2F4FA', fg: '#005A80' },
      prevu: { tag: 'Planifié', bg: '#FFF4DC', fg: '#7A4E08' }
    };
    const feed = [
      { when: 'Hier, 07:12', ...T.ok, text: 'Borne de la zone piscine redémarrée à distance. Coupure de 9 minutes, réglée avant l\'ouverture de la piscine.' },
      { when: 'Lun., 02:00', ...T.maint, text: 'Mise à jour de sécurité installée sur vos 70 bornes, de nuit, sans coupure pour vos vacanciers.' },
      { when: 'Sam., 21:00', ...T.info, text: 'Record de fréquentation de la saison : 338 vacanciers connectés en même temps. Réseau stable.' },
      { when: 'Mars 2027', ...T.prevu, text: 'Visite de contrôle avant saison avec Anthony, date à confirmer ensemble.' }
    ];
    if (incident) feed.unshift({ when: 'Aujourd\'hui, 07:02', ...T.cours, text: 'Borne de la zone piscine hors ligne. Notre équipe intervient à distance, nous vous tenons informé ici.' });
    return { accent, hero, toggle, feed: feed.slice(0, 4), interLabel: incident ? '1 en cours, 2 résolues' : 'toutes résolues' };
  }
}
window.Component = Component;
</script>
</body>
</html>
