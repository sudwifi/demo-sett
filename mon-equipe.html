<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06405C">
<title>Sud Wifi — Espace client · Mon équipe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icone-192.png">
<link rel="apple-touch-icon" href="assets/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sud Wifi démo">
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#FBF8F1;font-family:'Quicksand',system-ui,sans-serif;font-weight:500;color:#0E2A38}
a{color:#007EB1}a:hover{color:#005F86}
html,body{margin:0;height:100%;overflow:hidden;background:#06405C}
#dc-root{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.demo-btn{position:fixed;right:14px;bottom:14px;z-index:50;width:40px;height:40px;border-radius:50%;border:none;background:rgba(6,64,92,.35);color:#fff;font-size:18px;cursor:pointer;opacity:.45;transition:opacity .2s}
.demo-btn:hover,.demo-btn:focus-visible{opacity:1;background:#06405C}
.demo-panel{position:fixed;right:14px;bottom:62px;z-index:50;width:260px;background:#fff;color:#0E2A38;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px;font-family:'Quicksand',system-ui,sans-serif;font-weight:500;display:flex;flex-direction:column;gap:4px}
.demo-panel[hidden]{display:none}
.demo-title{margin:0 0 6px;font-family:'Fira Sans',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;color:#06405C}
.demo-panel a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:#0E2A38;text-decoration:none;font-size:14px}
.demo-panel a span{width:22px;height:22px;border-radius:50%;background:#E2F4FA;color:#005A80;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.demo-panel a:hover{background:#F2F9FC}
.demo-panel a[aria-current]{background:#007EB1;color:#fff;font-weight:700}
.demo-panel a[aria-current] span{background:#fff}
.demo-fs{margin-top:6px;font-family:inherit;font-size:14px;font-weight:700;padding:10px;border:none;border-radius:9px;background:#FAC420;color:#06405C;cursor:pointer}
.demo-hint{margin:6px 0 0;font-size:11px;color:#4A5A66;line-height:1.4}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 1440px; height: 1000px; display: flex; background: #FBF8F1; font-family: 'Quicksand', system-ui, sans-serif; color: #0E2A38">

<nav aria-label="Navigation principale" style="width: 256px; flex-shrink: 0; background: #06405C; color: #FFFFFF; display: flex; flex-direction: column; padding: 28px 18px; box-sizing: border-box; gap: 28px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 8px">
<img src="assets/logo-sud-wifi-nav.png" alt="Sud Wifi" style="width: 124px; height: auto; display: block">
<span style="font-size: 12px; color: #BFE3F0; letter-spacing: 0.12em; text-transform: uppercase">Espace client</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="tableau-de-bord.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Tableau de bord</a>
<a href="supervision.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Supervision temps réel</a>
<a href="suivi-sud-wifi.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Suivi Sud Wifi</a>
<a href="acces-vacanciers.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Accès vacanciers</a>
<a href="https://client.canalplus.com/?sc_intcmp=BUSINESS:USERMENU:CLIENT" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Canal+ Business<span aria-hidden="true">↗</span></a>
<a href="https://axonaut.com/customerPortal/userZone/dashboard" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Factures, contrats et tickets<span aria-hidden="true">↗</span></a>
<a href="mon-equipe.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; background: #007EB1; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Mon équipe</a>
<a href="https://aide.wifi-camping-var.fr" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #E3F2F8; text-decoration: none; font-size: 15px">Aide aux vacanciers<span aria-hidden="true">↗</span></a>
<div style="height: 1px; background: #0A5277; margin: 6px 4px"></div>
<a href="#" aria-disabled="true" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px; border-radius: 10px; color: #9FC3D6; text-decoration: none; font-size: 15px">Vidéosurveillance<span style="font-size: 11px; background: #0A5277; color: #E3F2F8; padding: 3px 7px; border-radius: 6px">bientôt</span></a>
</div>
<div style="margin-top: auto; background: #0A5277; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; color: #BFE3F0; text-transform: uppercase; letter-spacing: 0.06em">Votre interlocuteur</span>
<span style="font-weight: 600; font-size: 15px">Anthony, votre technicien</span>
<a href="tel:+33494030811" style="font-size: 16px; font-weight: 700; color: #FFFFFF; text-decoration: none">04 94 03 08 11</a>
<a href="mailto:support@sudwifi.fr" style="margin-top: 4px; text-align: center; background: #FAC420; color: #06405C; text-decoration: none; font-weight: 700; padding: 11px; border-radius: 10px; font-size: 14px">Contacter Sud Wifi</a>
<span style="font-size: 12px; color: #BFE3F0; text-align: center">support@sudwifi.fr</span>
</div>
</nav>

<main style="flex-grow: 1; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
<header style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: #4A5A66">Camping de démonstration</span>
<h1 style="margin: 0; font-family: 'Fira Sans', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.02em">Mon équipe</h1>
</div>
<span style="font-size: 14px; color: #4A5A66">Chaque personne a son propre compte.</span>
</header>

<sc-if value="{{showSeason}}" hint-placeholder-val="{{ true }}">
<section aria-label="Rappel de fin de saison" style="background: #FEF3D6; border: 1px solid #FAC420; border-radius: 16px; padding: 18px 22px; display: flex; align-items: center; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-weight: 700; font-size: 16px">Fin de saison : {{seasonCount}} comptes Accueil saisonniers sont encore actifs.</span>
<span style="font-size: 14px; color: #4A3A2E">Désactivez-les pour que plus personne ne puisse créer de codes en votre nom. Vous pourrez les réactiver au printemps.</span>
</div>
<button type="button" onClick="{{offSeason}}" style="font-family: inherit; font-size: 14px; font-weight: 700; padding: 12px 16px; min-height: 44px; border-radius: 10px; border: none; background: #06405C; color: #FFFFFF; cursor: pointer; flex-shrink: 0">Désactiver les saisonniers</button>
</section>
</sc-if>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; flex-grow: 1; min-height: 0">
<section aria-label="Collaborateurs" style="grid-column: span 2; background: #FFFFFF; border-radius: 16px; border: 1px solid #E3DDD1; overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 18px 22px; border-bottom: 1px solid #E3DDD1; display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700">Collaborateurs</h2>
<span style="font-size: 14px; color: #4A5A66">{{activeCount}} comptes actifs</span>
</div>
<div style="display: grid; grid-template-columns: 2.2fr 1fr 1fr 1.3fr 1.2fr; padding: 12px 22px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #4A5A66; background: #FAF8F3">
<span>Personne</span><span>Rôle</span><span>Statut</span><span>Dernière connexion</span><span>Action</span>
</div>
<sc-for list="{{members}}" as="m" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 2.2fr 1fr 1fr 1.3fr 1.2fr; padding: 12px 22px; align-items: center; border-top: 1px solid #EFEAE0; background: {{m.rowBg}}">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600; color: {{m.nameColor}}">{{m.name}}</span>
<span style="font-size: 13px; color: #4A5A66">{{m.email}}</span>
</div>
<span><span style="white-space: nowrap; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{m.roleBg}}; color: {{m.roleFg}}">{{m.role}}</span></span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: {{m.statusFg}}"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{m.dot}}"></span>{{m.status}}</span>
<span style="font-size: 14px; color: #4A5A66">{{m.last}}</span>
<span>
<sc-if value="{{m.canToggle}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{m.toggle}}" style="font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 12px; min-height: 44px; border-radius: 10px; border: 1px solid #B7E0EE; background: #FFFFFF; color: #005A80; cursor: pointer">{{m.action}}</button>
</sc-if>
<sc-if value="{{m.isOwner}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; color: #4A5A66">Vous</span>
</sc-if>
</span>
</div>
</sc-for>
</section>

<div style="display: flex; flex-direction: column; gap: 16px">
<section aria-label="Inviter un collaborateur" style="background: #FFFFFF; border-radius: 16px; padding: 22px; border: 1px solid #E3DDD1; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700">Inviter un collaborateur</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="inv-email" style="font-size: 14px; font-weight: 600">Adresse e-mail</label>
<input id="inv-email" type="email" placeholder="prenom@camping.fr" style="font-family: inherit; font-size: 15px; padding: 11px 12px; border-radius: 10px; border: 1px solid #D6CFC1; min-height: 44px; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="inv-role" style="font-size: 14px; font-weight: 600">Rôle</label>
<select id="inv-role" style="font-family: inherit; font-size: 15px; padding: 11px 12px; border-radius: 10px; border: 1px solid #D6CFC1; background: #FFFFFF; min-height: 44px"><option>Accueil</option><option>Gérant</option></select>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 44px"><input type="checkbox" checked style="width: 18px; height: 18px">Compte saisonnier (désactivation proposée en fin de saison)</label>
<button type="button" onClick="{{invite}}" style="font-family: inherit; font-size: 15px; font-weight: 700; padding: 13px; min-height: 48px; border-radius: 12px; border: none; background: #007EB1; color: #FFFFFF; cursor: pointer">Envoyer l'invitation</button>
<sc-if value="{{invited}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; color: #005A80; font-weight: 600">Invitation envoyée. Le lien est valable 72 heures.</span>
</sc-if>
</section>

<section aria-label="Les rôles" style="background: #06405C; color: #FFFFFF; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; color: #BFE3F0; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600">Les rôles</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 700; font-size: 15px">Gérant</span>
<span style="font-size: 14px; color: #E3F2F8; line-height: 1.45">Voit tout : statut, plan, interventions, rapports, factures. Gère l'équipe. Double authentification.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 700; font-size: 15px">Accueil</span>
<span style="font-size: 14px; color: #E3F2F8; line-height: 1.45">Crée, imprime et envoie les codes vacanciers. Ne voit ni le chiffre d'affaires ni les factures.</span>
</div>
</section>
</div>
</div>
</main>
</div>
</template>
<script src="assets/dc-lite.js"></script>
<script>
window.DEMO_PAGES = [{"file": "index.html", "title": "Connexion"}, {"file": "tableau-de-bord.html", "title": "Tableau de bord"}, {"file": "supervision.html", "title": "Supervision temps réel"}, {"file": "suivi-sud-wifi.html", "title": "Suivi Sud Wifi"}, {"file": "acces-vacanciers.html", "title": "Accès vacanciers"}, {"file": "mon-equipe.html", "title": "Mon équipe"}, {"file": "mobile.html", "title": "Version mobile"}];
window.DEMO_PAGE = {"file": "mon-equipe.html", "w": 1440, "h": 1000, "props": {}};
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { invited: false, people: [
      { id: 'g1', name: 'Claire D., vous', email: 'gerant@camping-exemple.fr', role: 'Gérant', season: false, on: true, last: 'Aujourd\'hui, 08:41', owner: true },
      { id: 'g2', name: 'Claire M.', email: 'direction@camping-exemple.fr', role: 'Gérant', season: false, on: true, last: 'Hier, 18:05' },
      { id: 'a1', name: 'Lucas B.', email: 'accueil1@camping-exemple.fr', role: 'Accueil', season: true, on: true, last: '24 sept.' },
      { id: 'a2', name: 'Inès R.', email: 'accueil2@camping-exemple.fr', role: 'Accueil', season: true, on: true, last: '29 sept.' },
      { id: 'a3', name: 'Tom D.', email: 'accueil3@camping-exemple.fr', role: 'Accueil', season: true, on: true, last: '30 sept.' },
      { id: 'a4', name: 'Accueil permanent', email: 'accueil@camping-exemple.fr', role: 'Accueil', season: false, on: true, last: 'Aujourd\'hui, 09:12' }
    ] };
  }
  renderVals() {
    const people = this.state.people;
    const setOn = (id, on) => this.setState({ people: people.map((p) => p.id === id ? { ...p, on } : p) });
    const members = people.map((p) => ({
      name: p.name, email: p.email, role: p.season ? p.role + ' · saison' : p.role, last: p.last,
      roleBg: p.role === 'Gérant' ? '#06405C' : '#E2F4FA', roleFg: p.role === 'Gérant' ? '#FFFFFF' : '#005A80',
      status: p.on ? 'Actif' : 'Désactivé', statusFg: p.on ? '#0E2A38' : '#6A7680', dot: p.on ? '#1E8E4E' : '#B8C0C6',
      nameColor: p.on ? '#0E2A38' : '#6A7680', rowBg: p.on ? '#FFFFFF' : '#F6F6F4',
      canToggle: !p.owner, isOwner: !!p.owner, action: p.on ? 'Désactiver' : 'Réactiver', toggle: () => setOn(p.id, !p.on)
    }));
    const seasonCount = people.filter((p) => p.season && p.on).length;
    return {
      members, seasonCount, showSeason: seasonCount > 0, activeCount: people.filter((p) => p.on).length,
      offSeason: () => this.setState({ people: people.map((p) => p.season ? { ...p, on: false } : p) }),
      invited: this.state.invited, invite: () => this.setState({ invited: true })
    };
  }
}
window.Component = Component;
</script>
</body>
</html>
